{% set name = "espnet-tts-frontend" %}
{% set version = "0.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/espnet/espnet_tts_frontend/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 36ef6f9a86b62711fc163a21b3121cc164d29f82322722e3085a987c9134dc31

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.7
  run:
    - g2p-en
    - inflect >=1.0.0
    - jaconv
    - pypinyin
    - python >=3.7
    - unidecode >=1.0.22

test:
  imports:
    - tacotron_cleaner
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://github.com/espnet/espnet_tts_frontend
  summary: 'A tools collection of text frontend for ESPnet tts recipes.'
  license: MIT
  license_file: tacotron_cleaner/LICENSE

extra:
  recipe-maintainers:
    - wietsedv
